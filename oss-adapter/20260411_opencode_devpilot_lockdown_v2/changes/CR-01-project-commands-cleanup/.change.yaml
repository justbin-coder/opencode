summary: >
  E5 审计遗漏：`.opencode/command/`（单数）目录中存在 7 个非交付开发命令，
  在 DevPilot 命令面板中可见。根因是 config.ts `loadCommand()` 同时扫描
  `{command,commands}/**/*.md`，E5 spec 只审计了 `commands/`（复数）路径。
  修复方式：删除 .opencode/command/ 下全部 7 个非交付命令文件，不引入代码改动。

